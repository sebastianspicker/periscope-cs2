name: Feature request
description: Propose a change within project scope
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Periscope monorepo: `anti-cheat/` (simulation lab), `radar/` (live radar product), `vision/` (pixel-only accessibility) and `lens/` (phone-camera track).
        Stay within each project's published safety scope.

  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which part of the monorepo?
      options:
        - anti-cheat
        - radar
        - vision
        - lens
        - monorepo meta
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete behavior, CLI, API, or lab surface if you have one.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Confirm this matches the selected subtree's architecture.
      options:
        - label: "vision: new capabilities (memory R/W, input, aim assistance) are placed behind adapters and documented (decision 0002)"
          required: false
        - label: "radar: real-backend changes come with build flags and risk notes"
          required: false
        - label: "anti-cheat: lesson or docs change in the simulation lab (real backends live in radar)"
          required: false
        - label: "lens: camera-first core; actuation paths opt-in and documented"
          required: false
        - label: I understand the above for the project I selected
          required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, workarounds, related issues, prior art in-repo.
