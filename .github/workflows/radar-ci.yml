name: Radar CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "radar/**"
      - "anti-cheat/**"
      - "scripts/check_architecture.py"
      - "scripts/verify.py"
      - ".github/workflows/radar-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5

      - name: Check architecture
        run: python3 scripts/check_architecture.py

      - name: Relay policy self-test
        run: python3 radar/relay/relay_core.py --self-test

      - name: Relay server loopback self-test
        run: python3 radar/relay/relay_server.py --self-test

      - name: Offset resolver self-test
        run: python3 radar/scripts/resolve_dumper_ref.py --self-test

      - name: Offset updater self-test
        run: python3 radar/scripts/update_cs2_signatures.py --self-test

      - name: Build and verify simulation
        run: python3 scripts/verify.py radar-sim

  real-capability-composition:
    name: Real capability composition (Windows x64)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure the supported real capability combination
        shell: pwsh
        run: >-
          cmake -S radar -B radar/build/real-capability
          -DLR_ENABLE_REAL_RPM=ON
          -DLR_ENABLE_REAL_SYSCALL=ON
          -DLR_ENABLE_REAL_GPU=ON
          -DLR_ENABLE_SHELLCODE_INJECTION=ON
          -DLR_BUILD_PROTOS=OFF
          -DLR_BUILD_DUELS=OFF
          -DLR_BUILD_STRATEGY_LAB=OFF

      - name: Build the composed real pipeline
        run: cmake --build radar/build/real-capability --target ac_real_pipeline --config Release
