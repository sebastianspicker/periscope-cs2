name: Lens CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "lens/**"
      - "scripts/check_architecture.py"
      - "scripts/verify.py"
      - ".github/workflows/lens-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lens

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync
        run: uv sync --frozen --extra dev

      - name: Architecture check
        working-directory: .
        run: python3 scripts/check_architecture.py

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy --strict src/periscope_lens/

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build

  android-companion:
    name: Android sources sanity (grep-level)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Located sources
        run: |
          set -euo pipefail
          test -f lens/android/app/src/main/java/dev/periscope/lens/TargetsEncoder.kt
          test -f lens/android/app/src/main/java/dev/periscope/lens/MainActivity.kt
          test -f lens/android/app/src/main/java/dev/periscope/lens/TransportHub.kt
          test -f lens/android/app/build.gradle.kts
          test -f lens/android/build.gradle.kts
          test -f lens/android/gradle.properties
          echo "Android drop present (no SDK lane; runtime-unverified by design)"
