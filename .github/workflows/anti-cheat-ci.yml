name: Anti-Cheat CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "anti-cheat/**"
      - "radar/adapters/real/cs2/posture.hpp"
      - "scripts/check_architecture.py"
      - "scripts/verify.py"
      - ".github/workflows/anti-cheat-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5

      - name: Check architecture
        run: python3 scripts/check_architecture.py

      - name: Build and verify simulation
        run: python3 scripts/verify.py anti-cheat-sim
